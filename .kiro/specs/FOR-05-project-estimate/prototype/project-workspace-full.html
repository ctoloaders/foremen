<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foremen — Project Workspace (prototype)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

/* ===== Design tokens: exact from foremen-frontend/src/index.css (light theme) ===== */
:root{
  --background:#ffffff;
  --foreground:#09090b;
  --card:#ffffff;
  --card-foreground:#09090b;
  --popover:#ffffff;
  --popover-foreground:#09090b;
  --border:#e4e4e7;
  --secondary:#f4f4f5;
  --secondary-foreground:#18181b;
  --muted:#f4f4f5;
  --muted-foreground:#71717a;
  --accent:#f4f4f5;
  --accent-foreground:#18181b;
  --destructive:#dc2626;
  --success:#16a34a;
  --warning:#ca8a04;
  --info:#2563eb;
  --primary:#18181b;
  --primary-foreground:#fafafa;
  --input:#e4e4e7;
  --ring:#a1a1aa;
  --radius:8px;
  --sidebar:240px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  background:var(--background);color:var(--foreground);
}
button{font-family:inherit}

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;left:0;top:0;z-index:40;height:100vh;width:var(--sidebar);
  border-right:1px solid var(--border);background:var(--background);
  display:flex;flex-direction:column;
}
.sb-header{display:flex;align-items:center;gap:12px;padding:16px}
.sb-brand-mark{
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  height:28px;width:28px;border-radius:6px;background:#ffffff;border:1px solid var(--border);
  color:#000;font-size:14px;font-weight:700;
}
.sb-brand-text{font-size:18px;font-weight:600;color:var(--foreground)}

/* Working-project card */
.wp-card{
  margin:0 8px 12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  background:var(--secondary);cursor:pointer;text-align:left;width:calc(100% - 16px);display:block;
}
.wp-card:hover{border-color:var(--ring)}
.wp-card .wp-caption{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted-foreground)}
.wp-card .wp-name{font-size:13px;font-weight:600;color:var(--foreground);margin-top:3px;line-height:1.25}
.wp-card .wp-foot{margin-top:8px}
.sb-switcher{display:flex;gap:6px;margin:0 8px 12px}
.sb-switcher button{
  flex:1;border:1px solid var(--border);background:var(--card);border-radius:8px;padding:6px 4px;
  font-size:12px;font-weight:500;cursor:pointer;color:var(--muted-foreground);
}
.sb-switcher button:hover{background:var(--secondary);color:var(--foreground)}
.sb-switcher button.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}

/* nav */
.sb-nav{flex:1;overflow-y:auto;padding:8px}
.nav-section{margin-bottom:16px}
.nav-section-title{
  font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted-foreground);padding:0 12px;margin-bottom:4px;
}
.nav-items{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;font-size:14px;
  color:var(--muted-foreground);cursor:pointer;transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--secondary);color:var(--foreground)}
.nav-item.active{background:var(--secondary);color:var(--foreground);font-weight:500}
.nav-item .ic{width:16px;text-align:center;flex:0 0 auto;font-size:14px}

/* user footer */
.sb-footer{border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px}
.sb-avatar{width:28px;height:28px;border-radius:50%;background:var(--secondary);display:grid;place-items:center;font-size:12px;color:var(--muted-foreground);flex:0 0 auto}
.sb-user-name{font-size:13px;color:var(--foreground);line-height:1.2}
.sb-user-role{font-size:11px;color:var(--muted-foreground);line-height:1.2}

/* ===== TOPBAR ===== */
.topbar{
  height:56px;border-bottom:1px solid var(--border);padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;background:var(--background);z-index:30;
}
.tb-left{display:flex;align-items:center;gap:12px;min-width:0}
.hamburger{display:none;border:none;background:none;color:var(--muted-foreground);font-size:20px;cursor:pointer;padding:6px}
.hamburger:hover{color:var(--foreground)}
.tb-title{font-size:14px;font-weight:500;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:8px}
.wp-chip{
  display:flex;align-items:center;gap:6px;background:var(--secondary);border:1px solid var(--border);
  border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--foreground);
}
.wp-chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.wp-chip b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.role-pill{background:var(--secondary);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-weight:500;font-size:12px;color:var(--foreground)}
.lang-toggle{
  border:none;background:none;border-radius:6px;padding:4px 8px;font-size:14px;font-weight:500;
  color:var(--muted-foreground);cursor:pointer;
}
.lang-toggle:hover{background:var(--secondary);color:var(--foreground)}
.preview-tag{font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--muted-foreground);text-transform:uppercase;border:1px solid var(--border);border-radius:4px;padding:2px 6px}

/* ===== MAIN ===== */
.shell{}
.main{margin-left:var(--sidebar);display:flex;flex-direction:column;min-height:100vh}
.content{padding:24px;flex:1}

/* Workspace header */
.ws-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.ws-head-left{min-width:0}
.ws-title{font-size:20px;font-weight:600;line-height:1.25}
.ws-sub{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.status-pill{border-radius:999px;padding:3px 10px;font-weight:600;font-size:12px}
.status-pill.offered{background:#dbeafe;color:#1e40af}
.status-pill.active{background:#dcfce7;color:#166534}
.mode-caption{font-size:13px;color:var(--muted-foreground)}
.ws-head-right{display:flex;align-items:center;gap:20px;flex-wrap:wrap}

/* readiness donut */
.donut-wrap{display:flex;align-items:center;gap:12px}
.donut{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;position:relative}
.donut::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--background)}
.donut .val{position:relative;z-index:1;font-size:14px;font-weight:600}
.gate-chips{display:flex;gap:6px;flex-wrap:wrap;max-width:360px}
.gate-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--card)}
.gate-chip .gd{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.gd.done{background:var(--success)}
.gd.partial{background:var(--warning)}
.gd.blocked{background:var(--destructive)}

/* tabs */
.tabstrip{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;margin-bottom:20px}
.tabstrip::-webkit-scrollbar{height:0}
.tab{
  padding:10px 14px;background:none;border:none;color:var(--muted-foreground);font-weight:500;font-size:14px;
  cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--foreground)}
.tab.active{color:var(--foreground);font-weight:600;border-bottom:2px solid var(--primary)}

/* cards / generic */
.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:16px}
.section-h{font-size:15px;font-weight:600;margin-bottom:12px}
.muted{color:var(--muted-foreground)}
.grid{display:grid;gap:12px}
.kpi-grid{grid-template-columns:repeat(4,1fr)}
.kpi{border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:var(--card)}
.kpi .k-label{font-size:12px;color:var(--muted-foreground)}
.kpi .k-value{font-size:20px;font-weight:600;margin-top:4px}
.kpi .k-hint{font-size:11px;color:var(--muted-foreground);margin-top:2px}
.two-col{grid-template-columns:1.4fr 1fr}
.btn{border:1px solid var(--border);background:var(--card);border-radius:6px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--foreground)}
.btn:hover{background:var(--secondary)}
.btn-primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btn-primary:hover{background:#000}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted-foreground);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cat-row td{background:var(--secondary);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
.exp-toggle{cursor:pointer;user-select:none}
.exp-toggle .caret{display:inline-block;width:14px;color:var(--muted-foreground);transition:transform .15s}
.exp-toggle.open .caret{transform:rotate(90deg)}
.exp-detail{display:none}
.exp-detail.open{display:table-row}
.exp-detail td{background:#fafafa;font-size:12px;color:var(--muted-foreground)}
.totals td{font-weight:600;border-top:2px solid var(--border)}
.src-tag{font-size:11px;background:var(--secondary);border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--muted-foreground)}

/* rooms */
.room-grid{grid-template-columns:repeat(4,1fr)}
.room{border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:var(--card)}
.room .r-name{font-weight:600}
.room .r-area{font-size:22px;font-weight:600;margin-top:6px}
.room .r-unit{font-size:12px;color:var(--muted-foreground)}

/* checklist */
.check-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.check-list li{display:flex;align-items:center;gap:10px;font-size:13px}
.check-box{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:11px;color:#fff;flex:0 0 auto}
.check-box.done{background:var(--success)}
.check-box.partial{background:var(--warning)}
.check-box.blocked{background:var(--destructive)}

/* gantt */
.gantt{display:flex;flex-direction:column;gap:10px}
.gantt-row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:12px}
.gantt-row .g-label{font-size:13px}
.gantt-track{position:relative;height:22px;background:var(--secondary);border-radius:6px;overflow:hidden}
.gantt-bar{position:absolute;top:0;height:100%;border-radius:6px;background:#cbd5e1}
.gantt-bar.plan{background:#d4d4d8}
.gantt-actual{position:absolute;top:4px;height:14px;border-radius:5px;background:var(--success);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:10px;font-weight:600}
.gantt-pct{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:600;color:var(--muted-foreground)}

/* signers / docs */
.doc-box{border:1px dashed var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px;background:var(--secondary)}
.doc-ic{font-size:22px}
.signer-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.signer-row:last-child{border-bottom:none}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:12px 0}
.seg button{border:none;background:var(--card);padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted-foreground);border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--primary);color:var(--primary-foreground)}
.sign-pill{border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600}
.sign-pill.pending{background:var(--secondary);color:var(--muted-foreground)}
.sign-pill.signed{background:#dcfce7;color:#166534}
.diff-old{color:var(--muted-foreground);text-decoration:line-through}
.diff-new{color:var(--success);font-weight:600}
.badge-admin{font-size:10px;font-weight:700;letter-spacing:.5px;background:var(--primary);color:var(--primary-foreground);border-radius:4px;padding:2px 6px}
.embed-note{border-left:3px solid var(--info);background:#eff6ff;padding:8px 12px;border-radius:0 6px 6px 0;font-size:12px;color:#1e3a5f;margin-top:12px}
.mt12{margin-top:12px}
.mt16{margin-top:16px}

/* signable documents */
.doc-list-row{cursor:pointer}
.doc-list-row:hover td{background:var(--secondary)}
.doc-list-row.sel td{background:#eff6ff}
.sign-pill.draft{background:var(--secondary);color:var(--muted-foreground)}
.sign-pill.awaiting{background:#fef9c3;color:#854d0e}
.method-panel{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:12px;background:var(--card)}
.upload-drop{border:1px dashed var(--ring);border-radius:var(--radius);padding:20px;text-align:center;color:var(--muted-foreground);font-size:13px;cursor:pointer;background:var(--secondary)}
.upload-drop:hover{background:#eef0f2}
.parafka-box{width:220px;height:96px;border:1px solid var(--foreground);border-radius:6px;background:#fff;position:relative;cursor:crosshair}
.parafka-box .cap{position:absolute;left:6px;bottom:4px;font-size:10px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.5px}
.parafka-box svg{position:absolute;inset:0;width:100%;height:100%}

/* clients block */
.client-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.client-row:last-child{border-bottom:none}
.client-ava{width:28px;height:28px;border-radius:50%;background:var(--secondary);display:grid;place-items:center;font-size:12px;color:var(--muted-foreground)}
.client-left{display:flex;align-items:center;gap:10px}

/* ===== bottom nav (mobile) ===== */
.bottom-nav{display:none}

/* ===== mobile mode ===== */
.mobile .sidebar{display:none}
.mobile .main{margin-left:0}
.mobile .content{padding-bottom:64px}
.mobile .hamburger{display:block}
.mobile .kpi-grid{grid-template-columns:repeat(2,1fr)}
.mobile .room-grid{grid-template-columns:repeat(2,1fr)}
.mobile .two-col{grid-template-columns:1fr}
.mobile .bottom-nav{
  display:flex;position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--background);
  border-top:1px solid var(--border);z-index:50;
}
.mobile .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted-foreground);cursor:pointer}
.mobile .bn-item .ic{font-size:16px}
.mobile .bn-item.active{color:var(--foreground)}

/* floating mobile toggle */
.mtoggle{position:fixed;right:16px;bottom:16px;z-index:60;width:44px;height:44px;border-radius:50%;background:var(--primary);color:var(--primary-foreground);border:none;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.mobile .mtoggle{bottom:72px}

@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.room-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="shell" id="root">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sb-header">
      <div class="sb-brand-mark">F</div>
      <span class="sb-brand-text">Foremen</span>
    </div>

    <button class="wp-card" id="wpCard" onclick="cycleProject()">
      <div class="wp-caption" data-i18n="wp.label"></div>
      <div class="wp-name" id="wpCardName"></div>
      <div class="wp-foot"><span class="status-pill" id="wpCardStatus"></span></div>
    </button>
    <div class="sb-switcher">
      <button id="switchA" onclick="setProject('A')" data-i18n="wp.projA"></button>
      <button id="switchB" onclick="setProject('B')" data-i18n="wp.projB"></button>
    </div>

    <nav class="sb-nav">
      <div class="nav-section">
        <div class="nav-items">
          <div class="nav-item active"><span class="ic">▤</span><span data-i18n="nav.dashboard"></span></div>
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title" data-i18n="nav.section.main"></div>
        <div class="nav-items">
          <div class="nav-item"><span class="ic">▦</span><span data-i18n="nav.projects"></span></div>
          <div class="nav-item"><span class="ic">▧</span><span data-i18n="nav.estimates"></span></div>
          <div class="nav-item"><span class="ic">▨</span><span data-i18n="nav.procurement"></span></div>
          <div class="nav-item"><span class="ic">▩</span><span data-i18n="nav.workcatalog"></span></div>
          <div class="nav-item"><span class="ic">₴</span><span data-i18n="nav.pricelist"></span></div>
          <div class="nav-item"><span class="ic">◍</span><span data-i18n="nav.users"></span></div>
          <div class="nav-item"><span class="ic">◈</span><span data-i18n="nav.roles"></span></div>
          <div class="nav-item"><span class="ic">◷</span><span data-i18n="nav.audit"></span></div>
          <div class="nav-item"><span class="ic">⚙</span><span data-i18n="nav.settings"></span></div>
        </div>
      </div>
    </nav>

    <div class="sb-footer">
      <div class="sb-avatar">AK</div>
      <div>
        <div class="sb-user-name">Anna Kowalska</div>
        <div class="sb-user-role" data-i18n="role.manager"></div>
      </div>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <div class="main">
    <header class="topbar">
      <div class="tb-left">
        <button class="hamburger" onclick="toggleMobileMenu()">☰</button>
        <h1 class="tb-title" id="tbTitle"></h1>
      </div>
      <div class="tb-right">
        <button class="wp-chip" onclick="cycleProject()">
          <span class="dot" id="tbChipDot"></span>
          <b id="tbChipName"></b>
        </button>
        <span class="role-pill" data-i18n="role.manager"></span>
        <button class="lang-toggle" id="langToggle" onclick="toggleLang()"></button>
        <span class="preview-tag">PREVIEW</span>
      </div>
    </header>

    <main class="content">
      <!-- workspace header -->
      <div class="ws-head">
        <div class="ws-head-left">
          <div class="ws-title" id="wsTitle"></div>
          <div class="ws-sub">
            <span class="status-pill" id="wsStatus"></span>
            <span class="mode-caption" id="wsMode"></span>
          </div>
        </div>
        <div class="ws-head-right">
          <div class="donut-wrap">
            <div class="donut" id="donut"><span class="val" id="donutVal"></span></div>
            <div>
              <div class="muted" style="font-size:12px" data-i18n="ws.readiness"></div>
              <div style="font-weight:600" id="readyText"></div>
            </div>
          </div>
          <div class="gate-chips" id="gateChips"></div>
        </div>
      </div>

      <!-- tabs -->
      <div class="tabstrip" id="tabstrip"></div>

      <!-- panels -->
      <div id="panels"></div>
    </main>

    <!-- bottom nav (mobile) -->
    <nav class="bottom-nav">
      <div class="bn-item active"><span class="ic">▤</span><span data-i18n="nav.dashboard"></span></div>
      <div class="bn-item"><span class="ic">▦</span><span data-i18n="nav.projects"></span></div>
      <div class="bn-item"><span class="ic">▧</span><span data-i18n="nav.estimates"></span></div>
      <div class="bn-item"><span class="ic">▨</span><span data-i18n="nav.procurement"></span></div>
      <div class="bn-item"><span class="ic">⚙</span><span data-i18n="nav.settings"></span></div>
    </nav>
  </div>
</div>

<button class="mtoggle" onclick="toggleMobile()" title="Toggle mobile">📱</button>

<script>
/* =========================================================================
   I18N — single active language, never both on one element
   ========================================================================= */
const I18N = {
  'brand': {pl:'Foremen', ru:'Foremen'},
  'wp.label': {pl:'Projekt roboczy', ru:'Рабочий проект'},
  'wp.projA': {pl:'Projekt A', ru:'Проект A'},
  'wp.projB': {pl:'Projekt B', ru:'Проект B'},
  'wp.choose': {pl:'Wybierz projekt', ru:'Выбрать проект'},

  'nav.section.main': {pl:'Główne', ru:'Основное'},
  'nav.dashboard': {pl:'Pulpit', ru:'Панель'},
  'nav.projects': {pl:'Projekty', ru:'Проекты'},
  'nav.estimates': {pl:'Kosztorysy', ru:'Сметы'},
  'nav.procurement': {pl:'Zakupy', ru:'Закупки'},
  'nav.workcatalog': {pl:'Katalog prac', ru:'Каталог работ'},
  'nav.pricelist': {pl:'Cennik', ru:'Прайс-лист'},
  'nav.users': {pl:'Użytkownicy', ru:'Пользователи'},
  'nav.roles': {pl:'Role', ru:'Роли'},
  'nav.audit': {pl:'Audyt', ru:'Аудит'},
  'nav.settings': {pl:'Ustawienia', ru:'Настройки'},

function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.getElementById('langToggle').textContent = (lang==='pl')?'PL':'RU';
  document.documentElement.lang = lang;
}
function statusColor(cls){ return cls==='offered' ? 'var(--info)' : 'var(--success)'; }

function renderHeader(){
  const p = PROJECTS[current];
  document.getElementById('tbTitle').textContent = p.name;
  document.getElementById('wpCardName').textContent = p.name;
  document.getElementById('wsTitle').textContent = p.name;

  const st = document.getElementById('wpCardStatus');
  st.className = 'status-pill '+p.statusClass; st.textContent = t(p.statusKey);
  const ws = document.getElementById('wsStatus');
  ws.className = 'status-pill '+p.statusClass; ws.textContent = t(p.statusKey);
  document.getElementById('wsMode').textContent = t(p.modeKey);

  document.getElementById('tbChipName').textContent = p.name;
  document.getElementById('tbChipDot').style.background = statusColor(p.statusClass);

  // donut
  document.getElementById('donut').style.background =
    `conic-gradient(var(--success) ${p.readiness}%, var(--border) 0)`;
  document.getElementById('donutVal').textContent = p.readiness+'%';
  document.getElementById('readyText').textContent = p.readiness+'%';

  // gates
  document.getElementById('gateChips').innerHTML = p.gates.map(g=>
    `<span class="gate-chip"><span class="gd ${g.state}"></span>${t(g.labelKey)}</span>`).join('');

  // switcher on-state
  document.getElementById('switchA').classList.toggle('on', current==='A');
  document.getElementById('switchB').classList.toggle('on', current==='B');
}
function renderTabs(){
  const p = PROJECTS[current];
  document.getElementById('tabstrip').innerHTML = p.tabs.map(tab=>
    `<button class="tab ${tab===activeTab?'active':''}" onclick="setTab('${tab}')">${t(tab)}</button>`).join('');
}
function renderPanel(){
  document.getElementById('panels').innerHTML = (PANELS[activeTab]||(()=>''))();
}
function renderAll(){ applyStaticI18n(); renderHeader(); renderTabs(); renderPanel(); }

/* =========================================================================
   INTERACTIONS
   ========================================================================= */
function toggleLang(){ lang = (lang==='pl')?'ru':'pl'; renderAll(); }
function setProject(id){ current = id; activeTab = PROJECTS[id].tabs[0]; sdSelected = 0; sdMethod = 'print'; estGroup = 'categories'; renderAll(); }
function cycleProject(){ setProject(current==='A'?'B':'A'); }
function setTab(tab){ activeTab = tab; renderTabs(); renderPanel(); }
function toggleExp(row){ row.classList.toggle('open'); const d=row.nextElementSibling; if(d&&d.classList.contains('exp-detail')) d.classList.toggle('open'); }
function segPick(btn){ btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
function signAll(){ document.querySelectorAll('#panels [data-sign]').forEach(p=>{ p.className='sign-pill signed'; p.textContent=t('sig.signed'); }); }
function setPh(seg){ phSeg = seg; renderPanel(); }
function setEstGroup(g){ estGroup = g; renderPanel(); }
function selectSignDoc(i){ sdSelected = i; renderPanel(); }
function setSdMethod(m){ sdMethod = m; renderPanel(); }
function drawParafka(){
  const box = document.getElementById('parafkaBox');
  if(!box || box.querySelector('svg')) return;
  box.insertAdjacentHTML('afterbegin',
    '<svg viewBox="0 0 220 96"><path d="M30 60 L60 78 L120 24" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 60 C150 30, 175 70, 200 40" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round"/></svg>');
}
function toggleMobile(){ document.getElementById('root').classList.toggle('mobile'); }
function toggleMobileMenu(){ /* placeholder: drawer not needed for preview */ }

/* init */
renderAll();
