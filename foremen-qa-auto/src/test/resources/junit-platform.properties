# Cucumber configuration on the JUnit 5 platform.
# The declarative @Suite in RunSmokeTest is the primary runner; these properties provide
# consistent defaults for IDE/direct engine discovery and for `./gradlew test`.

# Glue (step definitions + support/hooks) packages.
cucumber.glue=com.foremen.qa.steps,com.foremen.qa.support

# Default tag filter: @smoke. Overridable via -Dcucumber.filter.tags (the smokeTest task
# maps -DQA_TAGS onto this) e.g. "@smoke and @FOR-03".
cucumber.filter.tags=@smoke

# Reports: pretty console + HTML + JSON under the module build dir.
cucumber.plugin=pretty, html:build/qa-report/cucumber.html, json:build/qa-report/cucumber.json

# Keep the console output readable.
cucumber.publish.quiet=true
