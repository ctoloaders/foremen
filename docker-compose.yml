services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foremen}
      POSTGRES_USER: ${POSTGRES_USER:-foremen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foremen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foremen} -d ${POSTGRES_DB:-foremen}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  liquibase:
    image: liquibase/liquibase:4.31
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./foremen-backend/database_files:/liquibase/changelog/database_files
    command: >
      --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-foremen}
      --username=${POSTGRES_USER:-foremen}
      --password=${POSTGRES_PASSWORD:-foremen}
      --changelog-file=database_files/changelog.xml
      --search-path=/liquibase/changelog
      update

  backend:
    build:
      context: ./foremen-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-foremen}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-foremen}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-foremen}
      SPRING_LIQUIBASE_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      FOREMEN_JWT_SECRET: OCkzzat3me2NVZJAol9w19xSPmeJDJ1epy7xOpTxgiw=
      MAIL_HOST: smtp-relay.gmail.com
      MAIL_PORT: 587
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "true"
      MAIL_USERNAME:
      MAIL_PASSWORD:
      MAIL_FROM: info@foremen.eu
      FOREMEN_ADMIN_CREATE: true
      FOREMEN_ADMIN_EMAIL: cto+1@loaders.dev
      FOREMEN_ADMIN_PASSWORD: alejano123
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./foremen-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
