services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foremen}
      POSTGRES_USER: ${POSTGRES_USER:-foremen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foremen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foremen} -d ${POSTGRES_DB:-foremen}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # FOR-05-13 collaborative estimate: distributed store for presence + shared staged-edit drafts
  # (and pub/sub fan-out across backend instances). Ephemeral state only — no persistence volume.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  liquibase:
    image: liquibase/liquibase:4.31
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./foremen-backend/database_files:/liquibase/changelog/database_files
    command: >
      --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-foremen}
      --username=${POSTGRES_USER:-foremen}
      --password=${POSTGRES_PASSWORD:-foremen}
      --changelog-file=database_files/changelog.xml
      --search-path=/liquibase/changelog
      update

  backend:
    build:
      context: ./foremen-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-foremen}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-foremen}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-foremen}
      SPRING_LIQUIBASE_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      FOREMEN_JWT_SECRET: OCkzzat3me2NVZJAol9w19xSPmeJDJ1epy7xOpTxgiw=
      MAIL_HOST: smtp-relay.gmail.com
      MAIL_PORT: 587
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "true"
      MAIL_USERNAME:
      MAIL_PASSWORD:
      MAIL_FROM: info@foremen.eu
      FOREMEN_ADMIN_CREATE: true
      FOREMEN_ADMIN_EMAIL: cto+1@loaders.dev
      FOREMEN_ADMIN_PASSWORD: alejano123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # FOR-03-10: Google OAuth client id (from .env; blank disables Google login)
      FOREMEN_GOOGLE_CLIENT_ID: ${FOREMEN_GOOGLE_CLIENT_ID:-}
      # FOR-07-04 bank ledger (from .env / shell; real Salt Edge values live in .secrets/saltedge.env).
      # Local stack: STUB on, public base URL = local frontend; Salt Edge + AI off unless set.
      FOREMEN_PUBLIC_BASE_URL: ${FOREMEN_PUBLIC_BASE_URL:-http://localhost:3000}
      FOREMEN_BANK_STUB_ENABLED: ${FOREMEN_BANK_STUB_ENABLED:-true}
      FOREMEN_BANK_SECRETS_KEY: ${FOREMEN_BANK_SECRETS_KEY:-}
      SALTEDGE_ENABLED: ${SALTEDGE_ENABLED:-false}
      SALTEDGE_MODE: ${SALTEDGE_MODE:-CLIENT}
      SALTEDGE_BASE_URL: ${SALTEDGE_BASE_URL:-}
      SALTEDGE_APP_ID: ${SALTEDGE_APP_ID:-}
      SALTEDGE_SECRET: ${SALTEDGE_SECRET:-}
      SALTEDGE_PRIVATE_KEY_PATH: ${SALTEDGE_PRIVATE_KEY_PATH:-}
      SALTEDGE_CALLBACK_PUBLIC_KEY: ${SALTEDGE_CALLBACK_PUBLIC_KEY:-}
      SALTEDGE_CUSTOMER_IDENTIFIER: ${SALTEDGE_CUSTOMER_IDENTIFIER:-foremen-company}
      SALTEDGE_LEAD_EMAIL: ${SALTEDGE_LEAD_EMAIL:-}
      SALTEDGE_INCLUDE_FAKE: ${SALTEDGE_INCLUDE_FAKE:-true}
      BANK_AI_ENABLED: ${BANK_AI_ENABLED:-false}
      BANK_AI_MODEL: ${BANK_AI_MODEL:-gemini-3.8-flash}
      BANK_AI_PROJECT: ${BANK_AI_PROJECT:-}
      BANK_AI_LOCATION: ${BANK_AI_LOCATION:-europe-central2}
      BANK_AI_API_KEY: ${BANK_AI_API_KEY:-}
      BANK_AI_CREDENTIALS: ${BANK_AI_CREDENTIALS:-}
      # FOR-05-02 rooms auto-import. Local/CI default: feature ON with the deterministic stub LLM
      # (no credentials needed). For live Gemini set FOREMEN_ROOMS_IMPORT_LLM_STUB=false and provide
      # either FOREMEN_ROOMS_IMPORT_LLM_API_KEY or PROJECT/LOCATION(+CREDENTIALS_*) in .env.
      # The LLM_* values below are null-valued on purpose: they are passed through only when set, so
      # an unset one is NOT exported as "" and the backend falls back to foremen.ocr.llm.* (chained default).
      FOREMEN_ROOMS_IMPORT_ENABLED: ${FOREMEN_ROOMS_IMPORT_ENABLED:-true}
      FOREMEN_ROOMS_IMPORT_LLM_STUB: ${FOREMEN_ROOMS_IMPORT_LLM_STUB:-true}
      FOREMEN_ROOMS_IMPORT_LLM_MODEL:
      FOREMEN_ROOMS_IMPORT_LLM_PROJECT:
      FOREMEN_ROOMS_IMPORT_LLM_LOCATION:
      FOREMEN_ROOMS_IMPORT_LLM_API_KEY:
      FOREMEN_ROOMS_IMPORT_LLM_CREDENTIALS_PATH:
      FOREMEN_ROOMS_IMPORT_LLM_CREDENTIALS_LOCATION:
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./foremen-frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
