    get:
      tags: [dictionaries]
      operationId: listCurrencies
      summary: List currencies (read)
      security:
        - bearer-jwt: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /api/material-categories:
    get:
      tags: [dictionaries]
      operationId: listMaterialCategories
      summary: List material categories (read)
      security:
        - bearer-jwt: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /api/worker-types:
    get:
      tags: [dictionaries]
      operationId: listWorkerTypes
      summary: List worker types (read)
      security:
        - bearer-jwt: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ----------------------------------------------------------------------------
  # Team
  # ----------------------------------------------------------------------------
  /api/project-members:
    get:
      tags: [team]
      operationId: listProjectMembers
      summary: List project members (read)
      security:
        - bearer-jwt: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [team]
      operationId: assignProjectMember
      summary: Assign a user to a project (write)
      security:
        - bearer-jwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { $ref: '#/components/responses/Created' }
    patch:
      tags: [team]
      operationId: updateProjectMember
      summary: Update a project member's attributes (write)
      security:
        - bearer-jwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    delete:
      tags: [team]
      operationId: removeProjectMember
      summary: Remove a user from a project (write)
      security:
        - bearer-jwt: []
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '204': { description: Removed }

  /api/project-members/candidates:
    get:
      tags: [team]
      operationId: listProjectMemberCandidates
      summary: List candidates eligible to be assigned to a project (read)
      security:
        - bearer-jwt: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - name: term
          in: query
          required: false
          schema: { type: string }
        - name: role
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ----------------------------------------------------------------------------
  # Schedule
  # ----------------------------------------------------------------------------
  /api/project-schedules:
    get:
      tags: [schedule]
      operationId: getProjectSchedule
      summary: Read a project's work schedule (read)
      security:
        - bearer-jwt: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /api/project-schedules/bars:
    put:
      tags: [schedule]
      operationId: saveProjectScheduleBars
      summary: Save the schedule bars (write)
      security:
        - bearer-jwt: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /api/project-schedules/auto-create:
    post:
      tags: [schedule]
      operationId: autoCreateProjectSchedule
      summary: Auto-create the per-worker schedule (write)
      security:
        - bearer-jwt: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ----------------------------------------------------------------------------
  # Images
  # ----------------------------------------------------------------------------
  /api/images:
    post:
      tags: [images]
      operationId: uploadImage
      summary: Upload an image (write)
      description: >-
        Multipart image upload charged against a target ABAC resource; used by the
        rooms-from-plan goal to upload a plan image before creating rooms.
      security:
        - bearer-jwt: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                entityKind:
                  type: string
                resource:
                  type: string
      responses:
        '200': { $ref: '#/components/responses/Ok' }

components:

  securitySchemes:
    bearer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Foremen access token (the signed-in user's own JWT). Every tool call runs with the user's
        token and is subject to Foremen's ABAC matrix and project scope.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ProjectIdQuery:
      name: projectId
      in: query
      required: true
      schema: { type: integer, format: int64 }
    PackageCode:
      name: packageCode
      in: query
      required: true
      schema: { type: string }
    Query:
      name: query
      in: query
      required: false
      description: RSQL-style filter expression.
      schema: { type: string }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 20 }
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }

  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema: { type: object }
    Created:
      description: Created
      content:
        application/json:
          schema: { type: object }
