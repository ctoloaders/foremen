openapi: 3.0.3
info:
  title: Foremen Bot Toolset
  version: v1
  description: >-
    Curated subset of the Foremen REST API imported into the loaders-bot agent as its toolset
    (FOR-08-ai-assistant, task 2.2). It is hand-curated from the captured /v3/api-docs document
    (see .kiro/specs/FOR-08-ai-estimate/openapi/README.md) and contains ONLY the intended agent
    tool operations across projects, rooms, estimate, materials/assortment, catalog, sellers,
    procurement, dictionaries, team, schedule, and images.

    Excluded by design (Req 2.3): all /api/auth/**, POST /api/signatures/callback,
    POST /api/payments/webhook/**, and account/role administration
    (/api/users, /api/roles, /api/resources, /api/operations, /api/audit).

    Every operation requires the bearer-jwt security scheme (the signed-in user's own Foremen
    access token). GET operations are read/non-destructive; non-GET operations are writes and are
    shown to the user for explicit confirmation by the widget before execution (Req 2.4, D4).

servers:
  - url: /
    description: Foremen backend (same origin as the Foremen app)

# Bearer security applied to every operation (also declared per-operation below, Req 2.4).
security:
  - bearer-jwt: []

tags:
  - name: projects
    description: Projects — create/list/read/update and readiness-gated activation.
  - name: rooms
    description: Rooms of a project (CRUD).
  - name: estimate
    description: Estimate, estimate lines, the Estimate matrix (preview/save) and materials/reserve.
  - name: materials
    description: Materials, assortment groups/positions, work-material consumptions.
  - name: catalog
    description: Work items, work prices, work categories.
  - name: sellers
    description: Material sellers (list/search + CRUD).
  - name: procurement
    description: Procurement documents and procurement lines.
  - name: dictionaries
    description: Reference dictionaries (measurement units, VAT rates, room types, currencies, ...).
  - name: team
    description: Project memberships and candidate lookup.
  - name: schedule
    description: Project work schedule (read, save bars, auto-create).
  - name: images
    description: Image upload used by the rooms-from-plan goal.

paths:

  # ----------------------------------------------------------------------------
  # Projects
  # ----------------------------------------------------------------------------
  /api/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List projects (read)
      description: Paginated, access-filtered list of projects with their team and derived client.
      security:
        - bearer-jwt: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project (write)
      description: Custom transactional project creation. Requires PROJECTS/CREATE.
      security:
        - bearer-jwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { $ref: '#/components/responses/Created' }

  /api/projects/{id}:
    get:
      tags: [projects]
      operationId: getProject
      summary: Get a project by id (read)
      security:
        - bearer-jwt: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    put:
      tags: [projects]
      operationId: updateProject
      summary: Update a project (write)
      security:
        - bearer-jwt: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /api/projects/{id}/activate:
    post:
      tags: [projects]
      operationId: activateProject
      summary: Activate a project (write)
      description: Readiness-gated activation (pre-activation to ACTIVE). Requires PROJECTS/UPDATE.
      security:
        - bearer-jwt: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ----------------------------------------------------------------------------
  # Rooms
  # ----------------------------------------------------------------------------
  /api/rooms:
    get:
      tags: [rooms]
