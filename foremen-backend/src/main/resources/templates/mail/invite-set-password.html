<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${subject}">Foremen invitation</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:Arial,Helvetica,sans-serif;color:#333333;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;">
        <tr>
            <td align="center" style="padding:24px 12px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                       style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
                    <tr>
                        <td style="padding:32px;">
                            <h1 style="margin:0 0 16px;font-size:20px;color:#1a1a1a;" th:text="${subject}">
                                Foremen invitation
                            </h1>
                            <p style="margin:0 0 24px;font-size:15px;line-height:1.5;" th:text="${bodyText}">
                                You have been invited. Follow the link below to set your password.
                            </p>
                            <p style="margin:0 0 24px;">
                                <a th:href="${inviteLink}"
                                   style="display:inline-block;padding:12px 24px;background-color:#2563eb;color:#ffffff;
                                          text-decoration:none;border-radius:6px;font-size:15px;">
                                    <span th:text="${bodyText}">Set password</span>
                                </a>
                            </p>
                            <p style="margin:0;font-size:13px;line-height:1.5;color:#666666;">
                                <a th:href="${inviteLink}" th:text="${inviteLink}"
                                   style="color:#2563eb;word-break:break-all;">https://example.com/auth/set-password?token=...</a>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
