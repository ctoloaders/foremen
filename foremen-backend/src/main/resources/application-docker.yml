spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/foremen}
    username: ${SPRING_DATASOURCE_USERNAME:foremen}
    password: ${SPRING_DATASOURCE_PASSWORD:foremen}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false

foremen:
  cors:
    allowed-origins: ${FOREMEN_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://dev.foremen.eu}
  google:
    client-id: ${FOREMEN_GOOGLE_CLIENT_ID:}
  google-places:
    enabled: ${GOOGLE_PLACES_ENABLED:false}
    api-key: ${GOOGLE_PLACES_API_KEY:}
  bot:
    identity-secret: ${FOREMEN_BOT_IDENTITY_SECRET:}
    site-key: ${FOREMEN_BOT_SITE_KEY:}
  # FOR-07-04 bank ledger, local Docker stack: STUB connector on, public base URL = the local frontend
  # (STUB only; Salt Edge needs an HTTPS tunnel). The dev VM (also the `docker` profile) overrides both
  # via env: FOREMEN_BANK_STUB_ENABLED=false, FOREMEN_PUBLIC_BASE_URL=https://dev.foremen.eu.
  public-base-url: ${FOREMEN_PUBLIC_BASE_URL:http://localhost:3000}
  bank-feed:
    stub:
      enabled: ${FOREMEN_BANK_STUB_ENABLED:true}
