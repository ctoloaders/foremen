spring:
  profiles:
    active: local
  liquibase:
    change-log: classpath:database_files/changelog.xml
  # FOR-05-02: multipart limits are global in Spring. Endpoints with smaller limits (e.g.
  # foremen.image-storage.max-upload-size) keep enforcing them in code.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 220MB
  # FOR-05-13 collaborative estimate: Redis holds only ephemeral collaboration state (presence +
  # shared staged-edit drafts). No Spring Data Redis repositories are used.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          from: ${MAIL_ENVELOPE_FROM:${MAIL_FROM:${MAIL_USERNAME:}}}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: 8080

management:
  health:
    # FOR-05-13: Redis carries only optional collaboration state, so its outage must not mark the
    # whole service DOWN (the estimate degrades to single-user mode instead).
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs

foremen:
  cache:
    spec: "maximumSize=500,expireAfterWrite=10m"
  cors:
    allowed-origins: "http://localhost:3000"
  collab:
    # FOR-05-13 collaborative estimate (presence + shared staged-edit draft over STOMP/Redis).
    # When disabled (or Redis is unreachable) the estimate keeps working single-user: edits stay
    # in the browser's local store and nothing is shared.
    enabled: ${FOREMEN_COLLAB_ENABLED:true}
    # How long an untouched shared draft survives in Redis (days).
    draft-ttl-days: ${FOREMEN_COLLAB_DRAFT_TTL_DAYS:7}
    # A presence entry with no heartbeat for this long is treated as gone (seconds).
    presence-ttl-seconds: ${FOREMEN_COLLAB_PRESENCE_TTL_SECONDS:45}
    # Upper bound on staged edits held in one shared draft (guards Redis memory).
    max-draft-edits: ${FOREMEN_COLLAB_MAX_DRAFT_EDITS:2000}
  google:
    client-id: ${FOREMEN_GOOGLE_CLIENT_ID:}
  image-storage:
    # Shared ImageStorage service (FOR-04-17). All values from environment; no secrets committed.
    # When bucket + cdn-base are blank, storage is treated as not configured and uploads are
    # rejected gracefully (disabled fallback), while existing entities keep working without images.
    bucket: ${FOREMEN_IMAGE_STORAGE_BUCKET:}
    cdn-base: ${FOREMEN_IMAGE_STORAGE_CDN_BASE:}
    max-upload-size: ${FOREMEN_IMAGE_STORAGE_MAX_UPLOAD_SIZE:5MB}
    # FOR-05-08: the service account the backend impersonates to sign short-lived V4 download URLs
    # via the IAM signBlob service (keyless — no private key held). Blank = sign with the ADC
    # principal (e.g. the attached SA on a GCE/Cloud Run runtime).
    signer-service-account: ${FOREMEN_IMAGE_STORAGE_SIGNER_SERVICE_ACCOUNT:}
    # TTL (seconds) of a signed download URL; defaults to 600s when unset/non-positive.
    signed-url-ttl-seconds: ${FOREMEN_IMAGE_STORAGE_SIGNED_URL_TTL_SECONDS:}
    credentials:
      path: ${FOREMEN_IMAGE_STORAGE_CREDENTIALS_PATH:}
      location: ${FOREMEN_IMAGE_STORAGE_CREDENTIALS_LOCATION:}
    reconciliation:
      # Cron for the orphan-reconciliation job (FOR-04-17, Requirement 7.10). Defaults to "-"
      # (Scheduled.CRON_DISABLED) so the job is registered but never fires until a schedule is
      # supplied; a blank value would fail @Scheduled cron parsing, "-" disables it cleanly.
      cron: ${FOREMEN_IMAGE_STORAGE_RECONCILIATION_CRON:-}
      interval: ${FOREMEN_IMAGE_STORAGE_RECONCILIATION_INTERVAL:}
  ocr:
    # Backend OCR service (FOR-06-03). All values from environment; no secrets committed. When
    # enabled is false (or absent), the DisabledOcrService fallback is wired and the application
    # starts and runs normally without the Vision/LLM provider configured (R3.5). Credentials and
    # the LLM model are read from here, never hardcoded (R3.6), mirroring foremen.image-storage.
    enabled: ${FOREMEN_OCR_ENABLED:false}
    vision:
      credentials:
        path: ${FOREMEN_OCR_VISION_CREDENTIALS_PATH:}
        location: ${FOREMEN_OCR_VISION_CREDENTIALS_LOCATION:}
    llm:
      # The Google LLM (Gemini) model used for corner detection + per-line parse.
      model: ${FOREMEN_OCR_LLM_MODEL:gemini-3.8-flash}
      # Enterprise (Vertex) backend: project + location + ADC/credentials. Leave project/location
      # blank and set api-key to use the Gemini Developer API backend instead.
      project: ${FOREMEN_OCR_LLM_PROJECT:}
      location: ${FOREMEN_OCR_LLM_LOCATION:}
      api-key: ${FOREMEN_OCR_LLM_API_KEY:}
      credentials:
        path: ${FOREMEN_OCR_LLM_CREDENTIALS_PATH:}
        location: ${FOREMEN_OCR_LLM_CREDENTIALS_LOCATION:}
  rooms-import:
    # FOR-05-02 rooms auto-import. Only `enabled` has its own switch (default off); every llm.*
    # value defaults to what OCR already resolves (foremen.ocr.llm.*) and can be overridden with
    # FOREMEN_ROOMS_IMPORT_LLM_*.
    enabled: ${FOREMEN_ROOMS_IMPORT_ENABLED:false}
    llm:
      # true => deterministic StubRoomsVisionClient (tests / Docker); markers `STUB:*` in the prompt.
      stub: ${FOREMEN_ROOMS_IMPORT_LLM_STUB:false}
      model: ${FOREMEN_ROOMS_IMPORT_LLM_MODEL:${foremen.ocr.llm.model:gemini-3.8-flash}}
      project: ${FOREMEN_ROOMS_IMPORT_LLM_PROJECT:${foremen.ocr.llm.project:}}
      location: ${FOREMEN_ROOMS_IMPORT_LLM_LOCATION:${foremen.ocr.llm.location:}}
      api-key: ${FOREMEN_ROOMS_IMPORT_LLM_API_KEY:${foremen.ocr.llm.api-key:}}
      credentials:
        path: ${FOREMEN_ROOMS_IMPORT_LLM_CREDENTIALS_PATH:${foremen.ocr.llm.credentials.path:}}
        location: ${FOREMEN_ROOMS_IMPORT_LLM_CREDENTIALS_LOCATION:${foremen.ocr.llm.credentials.location:}}
    limits:
      max-files: 10
      max-file-size: 20MB
      max-pdf-pages: 50
      min-pdf-text-chars: 40
    ttl:
      result: 72h
      stuck-timeout: 15m
    max-concurrency: 4
    validation:
      area-tolerance: 0.02
      ceiling-min: 1.8
      ceiling-max: 6.0
      low-confidence: 0.6
    # Requirement 25 / design B5a: real-world ranges (target units) for the plausibility pass.
    plausibility:
      ceiling-height: { min: 1.8, max: 6.0 }
      door-height: { min: 1.8, max: 3.0 }
      door-width: { min: 0.6, max: 2.0 }
      window-height: { min: 0.3, max: 3.0 }
      window-width: { min: 0.3, max: 6.0 }
      wall-length: { min: 0.3, max: 50 }
      perimeter: { min: 2, max: 200 }
      floor-area: { min: 1, max: 500 }
      wall-area: { min: 2, max: 2000 }
      narrow-place: { min: 0, max: 200 }
      gap: { min: 0, max: 0.5 }
      count: { min: 0, max: 50 }
  dashboard:
    # FOR-10 dashboard widget AI assistant. Only `enabled` has its own switch (default off); every
    # llm.* value defaults to the rooms-import value (which itself defaults to foremen.ocr.llm.*)
    # and can be overridden with FOREMEN_DASHBOARD_AI_*.
    ai:
      enabled: ${FOREMEN_DASHBOARD_AI_ENABLED:false}
      rate-limit-per-minute: 10
      llm:
        # true => deterministic StubWidgetDraftClient (tests / Docker).
        stub: ${FOREMEN_DASHBOARD_AI_LLM_STUB:${foremen.rooms-import.llm.stub:false}}
        model: ${FOREMEN_DASHBOARD_AI_LLM_MODEL:${foremen.rooms-import.llm.model:gemini-3.8-flash}}
        project: ${FOREMEN_DASHBOARD_AI_LLM_PROJECT:${foremen.rooms-import.llm.project:}}
        location: ${FOREMEN_DASHBOARD_AI_LLM_LOCATION:${foremen.rooms-import.llm.location:}}
        api-key: ${FOREMEN_DASHBOARD_AI_LLM_API_KEY:${foremen.rooms-import.llm.api-key:}}
        credentials:
          path: ${FOREMEN_DASHBOARD_AI_LLM_CREDENTIALS_PATH:${foremen.rooms-import.llm.credentials.path:}}
          location: ${FOREMEN_DASHBOARD_AI_LLM_CREDENTIALS_LOCATION:${foremen.rooms-import.llm.credentials.location:}}
  translation:
    # Backend client<->staff message translation service (FOR-06-12). All values from environment;
    # no secrets committed. When enabled is false (or absent), the DisabledMessageTranslationService
    # fallback is wired and the application starts and runs normally without the Gemini provider
    # configured (R10.3) — messages stay available in their original locale only. Credentials and the
    # LLM model are read from here, never hardcoded (R10.2), mirroring foremen.ocr.
    enabled: ${FOREMEN_TRANSLATION_ENABLED:false}
    # The Google LLM (Gemini) model used for translation + locale classification.
    model: ${FOREMEN_TRANSLATION_MODEL:gemini-3.8-flash}
    # Enterprise (Vertex) backend: project + location + ADC/credentials. Leave project/location
    # blank and set api-key to use the Gemini Developer API backend instead.
    project: ${FOREMEN_TRANSLATION_PROJECT:}
    location: ${FOREMEN_TRANSLATION_LOCATION:}
    api-key: ${FOREMEN_TRANSLATION_API_KEY:}
    credentials:
      path: ${FOREMEN_TRANSLATION_CREDENTIALS_PATH:}
      location: ${FOREMEN_TRANSLATION_CREDENTIALS_LOCATION:}
  google-places:
    # When enabled, api-key must be set or application startup fails fast.
    enabled: ${GOOGLE_PLACES_ENABLED:false}
    api-key: ${GOOGLE_PLACES_API_KEY:}
  bot:
    # FOR-08: loaders-bot integration. identity-secret is the backend-only HS256 key used to sign
    # the identity token (never reaches the frontend/logs; blank => fail fast once a token is
    # signed, see BotIdentityTokenService). site-key is the public loaders-bot key
    # (pk_test_ sandbox / pk_live_ production) surfaced to the frontend; blank by default so the
    # app boots where the assistant is not configured.
    identity-secret: ${FOREMEN_BOT_IDENTITY_SECRET:}
    site-key: ${FOREMEN_BOT_SITE_KEY:}
  jwt:
    access-ttl-minutes: ${FOREMEN_JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${FOREMEN_JWT_REFRESH_TTL_DAYS:7}
    client-access-ttl-minutes: ${FOREMEN_JWT_CLIENT_ACCESS_TTL_MINUTES:120}
    client-refresh-ttl-days: ${FOREMEN_JWT_CLIENT_REFRESH_TTL_DAYS:30}
    secret: ${FOREMEN_JWT_SECRET:}
  admin:
    create: ${FOREMEN_ADMIN_CREATE:false}
    email: ${FOREMEN_ADMIN_EMAIL:}
    password: ${FOREMEN_ADMIN_PASSWORD:}
  invite:
    ttl-hours: ${FOREMEN_INVITE_TTL_HOURS:72}
  offer:
    escalation:
      # GLOBAL default Escalation_Threshold for a MANAGER_PROPOSAL (FOR-05-07, Requirement 6.4).
      # A proposal whose value EXCEEDS the cap for its kind requires ADMIN approval; a per-project
      # override on offer_project_settings takes precedence over these GLOBAL defaults. Leave a cap
      # blank to disable escalation for that kind (no cap => never escalate).
      percent-cap: ${FOREMEN_OFFER_ESCALATION_PERCENT_CAP:15}
      absolute-cap: ${FOREMEN_OFFER_ESCALATION_ABSOLUTE_CAP:5000}
  schedule:
    # FOR-05-10 (R9.1): net estimate value one worker produces per calendar day. Used ONLY inside
    # the planning-Gantt Auto_Create and Suggested_Duration logic; never returned by the API or
    # shown in the UI (R9.3). No per-project override (R9.2). Must be strictly positive or startup
    # fails fast.
    daily-output-per-worker: ${FOREMEN_SCHEDULE_DAILY_OUTPUT_PER_WORKER:2000}
  payments:
    # FOR-06-07 (R9.3, R10.2): cron for the periodic overdue sweep (OverdueSweepService) that
    # re-derives tranche statuses across PUBLISHED schedules and fires the one-shot trancheOverdue
    # notification on each tranche's first crossing into OVERDUE. Defaults to "-"
    # (Scheduled.CRON_DISABLED) so the task is registered but never fires until a schedule is
    # supplied; a blank value would fail @Scheduled cron parsing, "-" disables it cleanly. Overdue
    # state is also re-derived on read, so the domain stays correct even with the sweep disabled.
    overdue-sweep:
      cron: ${FOREMEN_PAYMENTS_OVERDUE_SWEEP_CRON:-}
  plan-actual:
    # FOR-06-02 (R4.3): the plan/actual overlay's at-risk tolerance. A work category is flagged
    # AT_RISK only once its confirmed (APPROVED) completion trails its elapsed-time share by more
    # than this. In [0, 1]; default 0.1 (10%).
    risk-margin: ${FOREMEN_PLAN_ACTUAL_RISK_MARGIN:0.1}
    # FOR-06-02 (R4.4): cap on the pace-extrapolated projected finish day, so a near-zero completion
    # cannot project to an absurd horizon. Defaults to the planning-Gantt 3650-day horizon.
    max-projected-finish-day: ${FOREMEN_PLAN_ACTUAL_MAX_PROJECTED_FINISH_DAY:3650}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    reset-base-url: ${MAIL_RESET_BASE_URL:http://localhost:3000/auth/reset-password}
    invite-base-url: ${MAIL_INVITE_BASE_URL:http://localhost:3000/auth/set-password}
  # FOR-07-04 bank ledger (R2.6, R4.3, R4.4, R8.1, R8.2, R15.1, R24.6). Nothing environment-specific
  # is hard-coded: every secret / per-environment value comes from env with a safe empty/off default,
  # so the application starts with no bank provider, no STUB, no AI and no secrets key configured.
  # Public URL the bank provider redirects the user back to and posts callbacks to
  # ({base}/bank/connections/return, {base}/api/bank-feed/saltedge/callbacks/{type}). Required per
  # environment, NO default: blank => the Salt Edge connector is unavailable (R8.2).
  public-base-url: ${FOREMEN_PUBLIC_BASE_URL:}
  bank-feed:
    sync:
      # Scheduled fallback pull (Europe/Warsaw). "-" (Scheduled.CRON_DISABLED) turns it off. With no
      # connector enabled there are no connections, so the tick is a no-op.
      cron: ${FOREMEN_BANK_SYNC_CRON:0 30 6 * * *}
      zone: ${FOREMEN_BANK_SYNC_ZONE:Europe/Warsaw}
      # A RUNNING sync run older than this is marked FAILED by the next tick.
      stale-after: ${FOREMEN_BANK_SYNC_STALE_AFTER:30m}
      executor:
        core: ${FOREMEN_BANK_SYNC_EXECUTOR_CORE:2}
        max: ${FOREMEN_BANK_SYNC_EXECUTOR_MAX:4}
        queue: ${FOREMEN_BANK_SYNC_EXECUTOR_QUEUE:50}
    consent:
      # CONSENT_EXPIRING starts this many days before the consent end.
      warn-days: ${FOREMEN_BANK_CONSENT_WARN_DAYS:14}
      # Daily consent sweep (same zone as sync); "-" disables.
      sweep-cron: ${FOREMEN_BANK_CONSENT_SWEEP_CRON:0 0 7 * * *}
      # PENDING_AUTH connections without accounts older than this are removed by the sweep.
      pending-auth-max-age: ${FOREMEN_BANK_CONSENT_PENDING_AUTH_MAX_AGE:24h}
    stub:
      # Dev/test STUB connector (R4.4). Off by default; never enabled in production.
      enabled: ${FOREMEN_BANK_STUB_ENABLED:false}
      page-size: 100
      consent-days: 90
    saltedge:
      # Salt Edge connector (R8.1). With enabled=false or incomplete keys it reports unavailable.
      enabled: ${SALTEDGE_ENABLED:false}
      mode: ${SALTEDGE_MODE:CLIENT}                         # PARTNER | CLIENT
      base-url: ${SALTEDGE_BASE_URL:}                       # blank => the default for the mode
      app-id: ${SALTEDGE_APP_ID:}
      secret: ${SALTEDGE_SECRET:}
      private-key-path: ${SALTEDGE_PRIVATE_KEY_PATH:}       # set => every request is signed
      callback-public-key: ${SALTEDGE_CALLBACK_PUBLIC_KEY:} # blank => bundled classpath key
      customer-identifier: ${SALTEDGE_CUSTOMER_IDENTIFIER:foremen-company}   # CLIENT identity
      lead-email: ${SALTEDGE_LEAD_EMAIL:}                                    # PARTNER identity
      fetch-days: ${SALTEDGE_FETCH_DAYS:89}
      include-fake-providers: ${SALTEDGE_INCLUDE_FAKE:true}  # false => Live (HTTPS base URL required)
      country-codes: ${SALTEDGE_COUNTRY_CODES:PL}
      banks-cache-ttl: ${SALTEDGE_BANKS_CACHE_TTL:1h}
      http-timeout: ${SALTEDGE_HTTP_TIMEOUT:60s}
  bank-ledger:
    match:
      auto-threshold: 0.90
      suggest-threshold: 0.50
      margin: 0.20
      max-suggestions: 3
    holder:
      # Account-holder vs company-name similarity at/above which an account is COMPANY.
      name-similarity: 0.80
    ai:
      # AI classifier (R15.1). Off by default => DisabledBankTransactionClassifier.
      enabled: ${BANK_AI_ENABLED:false}
      model: ${BANK_AI_MODEL:gemini-3.8-flash}
      # Vertex backend: project + location + ADC/credentials. Leave project blank and set api-key to
      # use the Gemini Developer API instead.
      project: ${BANK_AI_PROJECT:}
      location: ${BANK_AI_LOCATION:europe-central2}
      api-key: ${BANK_AI_API_KEY:}
      credentials-location: ${BANK_AI_CREDENTIALS:}
      max-per-run: ${BANK_AI_MAX_PER_RUN:200}
  bank-secrets:
    # AES-256-GCM key for per-connection bank credentials (R2.6): base64 of exactly 32 bytes,
    # key-version 1. Blank => not configured (per-connection secrets unavailable); never in the DB.
    key: ${FOREMEN_BANK_SECRETS_KEY:}
