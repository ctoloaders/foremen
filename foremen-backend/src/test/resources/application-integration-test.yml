spring:
  autoconfigure:
    exclude: []
  liquibase:
    enabled: false
  datasource:
    hikari:
      # Keep test connection pools small and non-persistent so their background
      # housekeeper/connection-adder threads do not keep probing Testcontainers
      # instances that have already been stopped (which otherwise floods the log with
      # "Connection refused" and delays JVM shutdown between test classes).
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 10000
      keepalive-time: 0
      max-lifetime: 60000
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  security:
    user:
      password: test
  mail:
    host: localhost
    port: 3025

foremen:
  jwt:
    secret: test-only-jwt-secret-value-0123456789-abcdef
    access-ttl-minutes: 30
    refresh-ttl-days: 7
  admin:
    create: false
  invite:
    ttl-hours: 72
  mail:
    invite-base-url: http://localhost:3000/auth/set-password
