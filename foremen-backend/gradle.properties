# Dependency versions
mapstructVersion=1.6.3
jqwikVersion=1.9.2
springdocVersion=2.8.6
jjwtVersion=0.12.6
googleApiClientVersion=2.8.1
googleCloudStorageVersion=2.56.0
# OpenHTMLtoPDF — HTML→PDF renderer isolated behind PdfFreezeService (FOR-05-08 task 6.3).
# Not managed by the Spring Boot BOM, so pin the version.
openHtmlToPdfVersion=1.0.10
# Apache POI — DOCX/OOXML toolkit isolated behind DocumentTemplateService's .docx import
# (FOR-05-08 task 10.1): extracts a .docx template's plain-text body. Not managed by the Spring
# Boot BOM, so pin the version.
apachePoiVersion=5.3.0
# Apache PDFBox — PDF page rasterization (PDFRenderer) for the FOR-06-03 OCR pipeline
# (GoogleOcrService, task 4.2). Already present transitively via openhtmltopdf-pdfbox; pinned and
# declared directly because GoogleOcrService uses PDFBox APIs directly. Not managed by the Spring
# Boot BOM, so pin the version (aligned with the openhtmltopdf-pdfbox transitive 2.0.24).
pdfboxVersion=2.0.24
# Google Cloud Vision — documentTextDetection OCR for the FOR-06-03 OCR pipeline
# (GoogleOcrService, task 4.2). Not managed by the Spring Boot BOM, so pin the version.
googleCloudVisionVersion=3.60.0
# Google Gen AI SDK — the Gemini LLM used for corner detection + per-line parse in the FOR-06-03
# OCR pipeline (GoogleOcrService, task 4.2). Replaces the deprecated google-cloud-vertexai
# generativeai package. Not managed by the Spring Boot BOM, so pin the version.
googleGenAiVersion=1.17.0
