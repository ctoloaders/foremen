name: Deploy backend (dev)

# Build the backend image and deploy ONLY the backend service to the dev VM.
# Triggers on push / merged PR to main. Keyless auth via Workload Identity
# Federation (configured by infra/dev/70-github-wif.sh).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Serialize backend deploys among themselves. (Cross-service serialization with
# the frontend repo happens on the VM via a flock in deploy-service.sh.)
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # required for WIF OIDC

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      ZONE: ${{ vars.GCP_ZONE }}
      AR_HOST: ${{ vars.AR_HOST }}
      AR_IMAGE: ${{ vars.AR_IMAGE }}        # e.g. europe-central2-docker.pkg.dev/<proj>/foremen/backend
      VM_NAME: ${{ vars.VM_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${AR_HOST}" --quiet

      - name: Build and push backend image
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          docker build \
            -t "${AR_IMAGE}:dev" \
            -t "${AR_IMAGE}:${SHA}" \
            -f foremen-backend/Dockerfile \
            foremen-backend
          docker push "${AR_IMAGE}:dev"
          docker push "${AR_IMAGE}:${SHA}"
          echo "Pushed ${AR_IMAGE}:dev and :${SHA}"

      - name: Deploy backend on the VM (via IAP SSH)
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" \
            --zone="${ZONE}" --tunnel-through-iap --quiet \
            --command="/opt/foremen/deploy-service.sh backend"
