# Cloud Build — backend (dev). Triggered by push to main in ctoloaders/foremen.
# Builds the backend image, pushes :dev + :<short-sha>, then redeploys ONLY the
# backend service on the dev VM over IAP SSH (schema migration + health-wait are
# handled by /opt/foremen/deploy-service.sh on the VM).
#
# Substitutions are provided by the Terraform-managed trigger:
#   _AR_IMAGE  e.g. europe-central2-docker.pkg.dev/<proj>/foremen/backend
#   _VM_NAME   foremen-dev
#   _ZONE      europe-central2-a
#   _SERVICE   backend

substitutions:
  _AR_IMAGE: ""
  _VM_NAME: "foremen-dev"
  _ZONE: "europe-central2-a"
  _SERVICE: "backend"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8      # faster Gradle build

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - "${_AR_IMAGE}:dev"
      - -t
      - "${_AR_IMAGE}:${SHORT_SHA}"
      - -f
      - foremen-backend/Dockerfile
      - foremen-backend

  - id: push-dev
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_AR_IMAGE}:dev"]

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_AR_IMAGE}:${SHORT_SHA}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud compute ssh "${_VM_NAME}" \
          --zone="${_ZONE}" --tunnel-through-iap --quiet \
          --command="/opt/foremen/deploy-service.sh ${_SERVICE}"

images:
  - "${_AR_IMAGE}:dev"
  - "${_AR_IMAGE}:${SHORT_SHA}"

timeout: 1800s
