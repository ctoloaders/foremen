# Foremen DEV stack — runs ON the VM via `docker compose`.
# Mirrors the local compose, with three differences:
#   1. Images are pulled from Artifact Registry (not built on the VM).
#   2. Only the frontend is published to the host, on port 80.
#   3. Secrets/values come from /opt/foremen/.env (written at VM boot).
#
# Postgres runs as a container with a named volume (the "cheap" option).
# To move to Cloud SQL later, drop the postgres service and point
# SPRING_DATASOURCE_URL at the Cloud SQL Auth Proxy.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  liquibase:
    image: liquibase/liquibase:4.31
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database_files:/liquibase/changelog/database_files
    command: >
      --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      --username=${POSTGRES_USER}
      --password=${POSTGRES_PASSWORD}
      --changelog-file=database_files/changelog.xml
      --search-path=/liquibase/changelog
      update

  backend:
    image: ${IMAGE_BACKEND}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_LIQUIBASE_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      FOREMEN_CORS_ALLOWED_ORIGINS: ${FOREMEN_CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://dev.foremen.eu}
      FOREMEN_JWT_SECRET: ${FOREMEN_JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-info@foremen.eu}
      MAIL_INVITE_BASE_URL: ${MAIL_INVITE_BASE_URL:-https://dev.foremen.eu/auth/set-password}
      MAIL_RESET_BASE_URL: ${MAIL_RESET_BASE_URL:-https://dev.foremen.eu/auth/set-password}
      FOREMEN_ADMIN_CREATE: "true"
      FOREMEN_ADMIN_EMAIL: ${FOREMEN_ADMIN_EMAIL}
      FOREMEN_ADMIN_PASSWORD: ${FOREMEN_ADMIN_PASSWORD}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACES_ENABLED: ${GOOGLE_PLACES_ENABLED:-false}
      # --- FOR-05-08 / FOR-06-03 object storage (dev VM) --------------------
      # Private GCS dev bucket for all media (procurement uploads, signable
      # documents). The VM has an attached service account
      # (foremen-dev-vm@starry-tracker-505110-s3), so the Google client resolves
      # Application Default Credentials off the GCE metadata server — NO key file
      # and NO ADC mount are needed here (unlike local dev's override, which
      # mounts ./.secrets/adc.json because a laptop has no attached SA). That SA
      # already holds storage.objectAdmin on the bucket and
      # iam.serviceAccountTokenCreator on itself (keyless V4 signBlob), so reads,
      # writes and short-lived signed download URLs all work.
      # cdn-base only satisfies the "configured" gate; the document download path
      # serves bytes via short-lived V4 SIGNED URLs, not the public URL.
      FOREMEN_IMAGE_STORAGE_BUCKET: ${FOREMEN_IMAGE_STORAGE_BUCKET:-foremen-dev-media-42938}
      FOREMEN_IMAGE_STORAGE_CDN_BASE: ${FOREMEN_IMAGE_STORAGE_CDN_BASE:-https://storage.googleapis.com/foremen-dev-media-42938}
      FOREMEN_IMAGE_STORAGE_SIGNER_SERVICE_ACCOUNT: ${FOREMEN_IMAGE_STORAGE_SIGNER_SERVICE_ACCOUNT:-foremen-dev-vm@starry-tracker-505110-s3.iam.gserviceaccount.com}
      FOREMEN_IMAGE_STORAGE_SIGNED_URL_TTL_SECONDS: ${FOREMEN_IMAGE_STORAGE_SIGNED_URL_TTL_SECONDS:-600}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-starry-tracker-505110-s3}
      # --- FOR-06-03 OCR (Vision + Gemini) ---------------------------------
      # OCR parse of uploaded procurement documents. The Gemini Developer-API key
      # is a secret, pulled from Secret Manager into .env at VM boot
      # (secret foremen-dev-ocr-gemini-key); when present, FOREMEN_OCR_ENABLED is
      # "true". The Vision client needs no key file — it uses the VM's attached-SA
      # ADC off the metadata server (same as object storage above).
      FOREMEN_OCR_ENABLED: ${FOREMEN_OCR_ENABLED:-false}
      FOREMEN_OCR_LLM_API_KEY: ${FOREMEN_OCR_LLM_API_KEY:-}
      FOREMEN_OCR_LLM_MODEL: ${FOREMEN_OCR_LLM_MODEL:-gemini-2.0-flash}
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    healthcheck:
      # "Is the app up and serving HTTP on :8080?" We do NOT assert the body,
      # because /actuator/health is secured (returns 401 until authenticated) —
      # a 401 still proves the server is live. Success = any HTTP status line
      # comes back. temurin (Ubuntu) ships bash, so use a /dev/tcp probe without
      # depending on curl/wget.
      # NOTE: must run under bash (/dev/tcp is a bash feature; Docker's CMD-SHELL
      # uses /bin/sh/dash which lacks it). temurin ships bash at /usr/bin/bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q 'HTTP/1.'"]
      interval: 10s
      timeout: 5s
      retries: 30          # e2-small cold start is slow; allow generous grace
      start_period: 90s
    restart: unless-stopped

  frontend:
    image: ${IMAGE_FRONTEND}
    # No host port: the frontend is reached through Caddy (TLS) on 80/443.
    # It still serves the SPA and proxies /api -> backend:8080 internally.
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # nginx:alpine ships busybox wget. 200 on the SPA root means it's serving.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"      # ACME HTTP-01 challenge + HTTP->HTTPS redirect
      - "443:443"    # public HTTPS entry for https://dev.foremen.eu
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # persisted certificates (survive restarts)
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
